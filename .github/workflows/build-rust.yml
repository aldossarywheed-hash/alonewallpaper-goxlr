name: Build Rust EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fix Cargo Workspace for Missing Members
        shell: pwsh
        run: |
          # قراءة ملف Cargo.toml وإزالة السطر الخاص بـ launcher لكي لا يبحث عنه النظام
          $content = Get-Content -Path Cargo.toml -Raw
          $content = $content -replace '"launcher"', ''
          $content = $content -replace "'launcher'", ''
          Set-Content -Path Cargo.toml -Value $content

      - name: Build with Cargo
        run: cargo build --release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: goxlr-utility-exe
          path: |
            target/release/*.exe
            target/release/*/*.exe
