name: Build Rust EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build from Source Directory
        run: |
          # العثور على مجلد المشروع البنّاء بناءً على محتويات المستودع وبناؤه
          cargo build --release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: goxlr-executable
          path: |
            target/release/*.exe
            target/release/*/*.exe
