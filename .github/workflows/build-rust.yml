name: Build Rust EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fix Cargo.toml syntax
        shell: pwsh
        run: |
          # إزالة أي فاصلة زائدة قد تتسبب في خطأ بناء مصفوفة الإعدادات
          $path = "Cargo.toml"
          $content = Get-Content -Path $path -Raw
          # إصلاح الفاصلة الزائدة في المصفوفات
          $content = $content -replace ',\s*\]', ']'
          Set-Content -Path $path -Value $content

      - name: Build with Cargo
        run: cargo build --release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: goxlr-utility-exe
          path: |
            target/release/*.exe
            target/release/*/*.exe
