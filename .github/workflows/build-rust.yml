name: Build Rust EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clean All Missing Workspace Members
        shell: pwsh
        run: |
          # قراءة ملف الإعدادات وإزالة أي أعضاء فرعية قديمة قد تسبب أخطاء مفقودة
          $file = "Cargo.toml"
          $content = Get-Content $file -Raw
          # تحويل الملف ليصبح مستقلاً بذاته بدون أعضاء Workspace ناقصة
          $content = $content -replace 'members\s*=\s*\[[\s\S]*?\]', 'members = []'
          Set-Content $file $content

      - name: Build Project
        run: cargo build --release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: goxlr-executable
          path: target/release/*.exe
