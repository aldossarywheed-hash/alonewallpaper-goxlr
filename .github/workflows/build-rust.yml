name: Build Rust EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Remove Virtual Cargo.toml and Build
        shell: pwsh
        run: |
          # حذف ملف Cargo.toml الافتراضي الذي يسبب المشاكل
          if (Test-Path "Cargo.toml") { Remove-Item "Cargo.toml" }
          
          # البحث عن ملف Cargo.toml الحقيقي داخل المجلدات الفرعية ونسخه للخارج
          $realCargo = Get-ChildItem -Recurse -Filter "Cargo.toml" | Where-Object { $_.DirectoryName -ne $PWD } | Select-Object -First 1
          if ($realCargo) {
              Copy-Item $realCargo.FullName -Destination "."
          }

      - name: Build Project
        run: cargo build --release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: goxlr-executable
          path: |
            target/release/*.exe
            target/release/*/*.exe
              cargo build --release
  
