name: Build Rust EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Remove Launcher from Cargo.toml
        shell: pwsh
        run: |
          $file = "Cargo.toml"
          $lines = Get-Content $file
          # تصفية السطور وإزالة أي سطر يحتوي على كلمة launcher
          $newLines = $lines | Where-Object { $_ -notlike "*launcher*" }
          Set-Content $file $newLines

      - name: Build Project
        run: cargo build --release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: goxlr-executable
          path: target/release/*.exe
